<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradiente principal: Tonos azules y violetas nativos y modernos -->
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Sombra sutil para separar el isotipo del fondo -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Grupo central: Bocadillo de voz como elemento principal y más grande -->
  <g filter="url(#shadow)">
    <!-- Bocadillo de voz escalado y centrado para ocupar casi todo el lienzo -->
    <path d="M64 5 C32.5 5 5.5 31 5.5 64 C5.5 77.5 10 89.5 17.5 100 L7 122.5 L31 115 C40 119.5 50.5 122.5 64 122.5 C95.5 122.5 122.5 95.5 122.5 64 C122.5 31 95.5 5 64 5 Z" fill="url(#bubble)" />
    
    <!-- Símbolo de Reproducción (Play) escalado proporcionalmente -->
    <path d="M50.5 46 L50.5 82 L77.5 64 Z" fill="#ffffff" />
    
    <!-- Ondas de Audio (Lectura natural en voz alta) escaladas proporcionalmente -->
    <path d="M85 52 C89 57 89 71 85 76" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M95 44 C102 50 102 78 95 84" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
</svg>